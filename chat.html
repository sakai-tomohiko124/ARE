
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>ARE | チャット</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2d;--panel2:#1b253a;--line:#2b3851;--text:#edf2ff;--muted:#9aa8c2;--accent:#7c9cff;--accent2:#5578ed;--danger:#ff7777;--success:#5de0b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100dvh;min-height:540px}
.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:#0f1627}
.brand{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.brand h1{font-size:24px;letter-spacing:2px;margin:0}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}
.userbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.avatar{display:flex;align-items:center;justify-content:center;flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:#34466b;color:white;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-info{flex:1;min-width:0}
.user-info strong,.user-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-info small{color:var(--muted);font-size:12px;margin-top:3px}
.button{border:0;border-radius:10px;background:var(--accent2);color:white;padding:10px 13px;font-weight:650}
.button:hover{filter:brightness(1.1)}
.button-secondary{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:9px 12px}
.button-danger{border:1px solid #743f50;background:#3b1e2b;color:#ffb5c0;border-radius:9px;padding:8px 10px}
.sidebar-content{padding:16px;overflow-y:auto;min-height:0}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.section-heading h2{font-size:14px;margin:0}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;outline:none}
.search:focus,textarea:focus,input:focus{border-color:var(--accent)}
.user-list,.room-list{display:flex;flex-direction:column;gap:7px}
.person,.room-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text);text-align:left;width:100%;min-width:0}
.person:hover,.room-item:hover,.room-item.active{background:var(--panel2);border-color:var(--line)}
.person .person-text,.room-item .person-text{flex:1;min-width:0}
.person strong,.person small,.room-item strong,.room-item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person small,.room-item small{color:var(--muted);font-size:12px;margin-top:3px}
.person .add{font-size:19px;color:var(--accent);font-weight:700}
.room-item .avatar,.person .avatar{width:38px;height:38px;flex-basis:38px}
.section-divider{height:1px;background:var(--line);margin:20px 0}
.empty-list{color:var(--muted);font-size:13px;line-height:1.7;padding:12px 4px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:#0f1627;min-height:78px}
.chat-header .person-text{flex:1;min-width:0}
.chat-header h2{font-size:17px;margin:0}
.chat-header p{font-size:12px;color:var(--muted);margin:4px 0 0}
.mobile-back{display:none}
.messages{flex:1;min-height:0;overflow-y:auto;padding:24px clamp(12px,4vw,48px);display:flex;flex-direction:column;gap:14px}
.welcome{margin:auto;text-align:center;max-width:390px;color:var(--muted);line-height:1.8}
.welcome .welcome-icon{font-size:48px;margin-bottom:10px}
.welcome h2{color:var(--text);font-size:22px;margin:0 0 8px}
.day-divider{text-align:center;color:var(--muted);font-size:11px;margin:8px 0}
.message-row{display:flex;align-items:flex-end;gap:9px;max-width:min(82%,700px)}
.message-row.own{align-self:flex-end;flex-direction:row-reverse}
.message-avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:#34466b;display:flex;align-items:center;justify-content:center;font-size:11px;overflow:hidden}
.message-avatar img{width:100%;height:100%;object-fit:cover}
.message-body{min-width:0}
.message-sender{font-size:11px;color:var(--muted);margin:0 0 5px 3px}
.message-row.own .message-sender{text-align:right}
.bubble{padding:11px 14px;border:1px solid var(--line);background:var(--panel);border-radius:15px 15px 15px 4px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.65}
.message-row.own .bubble{background:#273d73;border-color:#405b9c;border-radius:15px 15px 4px 15px}
.message-time{font-size:10px;color:var(--muted);margin-top:5px}
.message-row.own .message-time{text-align:right}
.attachment{display:flex;flex-direction:column;gap:8px;max-width:min(100%,380px)}
.attachment img{max-width:100%;max-height:330px;object-fit:contain;border-radius:10px;background:#0b1020}
.attachment video{max-width:100%;max-height:300px;border-radius:10px;background:#000}
.attachment a{color:#c6d6ff;overflow-wrap:anywhere}
.file-card{display:flex;gap:10px;align-items:center;padding:10px;background:#111a2d;border:1px solid var(--line);border-radius:10px}
.file-icon{font-size:25px}
.file-name{overflow-wrap:anywhere}
.file-meta{font-size:11px;color:var(--muted);margin-top:3px}
.composer{padding:14px clamp(12px,3vw,32px) 18px;border-top:1px solid var(--line);background:#0f1627}
.composer-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tool-button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px;border-radius:9px;font-size:12px}
.file-input{display:none}
.composer-bottom{display:flex;align-items:flex-end;gap:10px}
.composer textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:180px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);outline:none;line-height:1.5}
.char-count{font-size:11px;color:var(--muted);text-align:right;margin:6px 4px 0}
.status{padding:10px 14px;font-size:13px;line-height:1.6;display:none}
.status.show{display:block}
.status.error{color:#ffb1b1;background:#3b1e2b}
.status.success{color:#9df2d0;background:#12382f}
.status.info{color:#c9d7ff;background:#1c2b4b}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;padding:12px 16px;border-radius:10px;background:#26344d;color:white;box-shadow:0 10px 35px #0008;max-width:90vw;display:none}
.toast.show{display:block}
.loading{opacity:.65;pointer-events:none}
@media(max-width:800px){.app{grid-template-columns:minmax(0,1fr)}.sidebar{position:absolute;inset:0;z-index:2;display:flex}.main{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.mobile-back{display:inline-block}.messages{padding:18px 12px}.message-row{max-width:92%}.chat-header{padding:12px}.composer{padding:12px}}
@media(min-width:801px){.app{height:100dvh}.sidebar{width:320px}}
</style>
</head>
<body>
<div class="app" id="app">
    <aside class="sidebar">
        <div class="brand">
            <div><h1>ARE</h1><small>CONNECT YOUR WORLD</small></div>
            <button class="button-secondary" id="logoutButton" type="button">ログアウト</button>
        </div>
        <div class="userbar">
            <div class="avatar" id="myAvatar">A</div>
            <div class="user-info"><strong id="myName">読み込み中...</strong><small id="myLoginStatus">接続を確認しています</small></div>
        </div>
        <div class="sidebar-content">
            <div class="section-heading"><h2>🔎 おすすめユーザー</h2><button class="button-secondary" id="refreshUsersButton" type="button">更新</button></div>
            <input class="search" id="userSearch" type="search" placeholder="ユーザー名を検索..." autocomplete="off">
            <div class="user-list" id="recommendedUsers"><div class="empty-list">ユーザーを読み込んでいます...</div></div>
            <div class="section-divider"></div>
            <div class="section-heading"><h2>💬 チャット</h2><button class="button-secondary" id="refreshRoomsButton" type="button">更新</button></div>
            <div class="room-list" id="roomList"><div class="empty-list">チャットを読み込んでいます...</div></div>
        </div>
    </aside>

    <main class="main">
        <header class="chat-header">
            <button class="button-secondary mobile-back" id="backButton" type="button">← 戻る</button>
            <div class="avatar" id="chatAvatar">💬</div>
            <div class="person-text"><h2 id="chatTitle">AREへようこそ</h2><p id="chatSubtitle">チャット相手を選択してください</p></div>
            <button class="button-secondary" id="refreshMessagesButton" type="button" disabled>更新</button>
        </header>

        <div class="status" id="pageStatus" role="status" aria-live="polite"></div>

        <section class="messages" id="messages" aria-live="polite">
            <div class="welcome"><div class="welcome-icon">✉️</div><h2>会話を始めよう</h2><div>おすすめユーザーを選択するか、既存のチャットを開いてください。</div></div>
        </section>

        <section class="composer">
            <div class="composer-tools">
                <label class="tool-button" for="imageInput">🖼️ 画像を選択</label>
                <input class="file-input" id="imageInput" type="file" accept="image/*" multiple>
                <label class="tool-button" for="fileInput">📎 ファイルを選択</label>
                <input class="file-input" id="fileInput" type="file" multiple accept=".pdf,.docx,.xlsx,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation">
                <label class="tool-button" for="videoInput">🎬 動画を選択</label>
                <input class="file-input" id="videoInput" type="file" accept="video/*">
                <span id="attachmentStatus" style="font-size:11px;color:var(--muted)"></span>
            </div>
            <div class="composer-bottom">
                <textarea id="messageInput" maxlength="10000" placeholder="メッセージを入力...（Enterで送信、Shift+Enterで改行）" disabled></textarea>
                <button class="button" id="sendButton" type="button" disabled>送信</button>
            </div>
            <div class="char-count"><span id="charCount">0</span> / 10,000文字</div>
        </section>
    </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./apikey.js"></script>
<script src="./system.js"></script>
<script>
(function(){
    "use strict";

    const TABLES = Object.freeze({
        profiles: "profiles",
        rooms: "chat_rooms",
        members: "chat_room_members",
        messages: "messages"
    });

    const STORAGE_BUCKET = "chat-attachments";
    const MAX_TEXT_LENGTH = 2000;
    const MAX_IMAGES = 10;
    const MAX_VIDEO_SECONDS = 300;
    const MAX_FILE_BYTES = 50 * 1024 * 1024;
    const MAX_VIDEO_BYTES = 50 * 1024 * 1024;
    const FILE_MIME_BY_EXT = {
        pdf:"application/pdf",
        docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",
        jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",heic:"image/heic",heif:"image/heif",
        mp4:"video/mp4",mov:"video/quicktime",webm:"video/webm"
    };
    function fileExt(file){ const m = /\.([A-Za-z0-9]+)$/.exec(file.name || ""); return m ? m[1].toLowerCase() : ""; }
    function resolveMime(file){
        const byExt = FILE_MIME_BY_EXT[fileExt(file)];
        if(file.type && file.type !== "application/octet-stream") return file.type;
        return byExt || "application/octet-stream";
    }

    const state = {
        client: null,
        user: null,
        profile: null,
        rooms: [],
        recommendations: [],
        currentRoom: null,
        currentPartner: null,
        messages: [],
        subscription: null,
        loadingMessages: false,
        sending: false,
        loadingRooms: false,
        loadingUsers: false,
        searchText: "",
        authSubscription: null
    };

    const el = {};
    const $ = (id) => document.getElementById(id);

    function cacheElements(){
        [
            "app","logoutButton","myAvatar","myName","myLoginStatus",
            "refreshUsersButton","userSearch","recommendedUsers","refreshRoomsButton",
            "roomList","backButton","chatAvatar","chatTitle","chatSubtitle",
            "refreshMessagesButton","pageStatus","messages","imageInput","fileInput",
            "videoInput","attachmentStatus","messageInput","sendButton","charCount","toast"
        ].forEach((id) => el[id] = $(id));
    }

    function safeHttpUrl(value){
        try{
            const u = new URL(String(value || ""), window.location.href);
            return u.protocol === "https:" ? u.href : "";
        }catch(_error){ return ""; }
    }

    function escapeHtml(value){
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
            "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        })[char]);
    }

    function shortName(value){
        const name = String(value || "A").trim();
        return Array.from(name)[0] || "A";
    }

    function formatDate(value){
        if(!value) return "";
        const date = new Date(value);
        if(Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("ja-JP",{hour:"2-digit",minute:"2-digit"}).format(date);
    }

    function formatBytes(bytes){
        if(!Number.isFinite(bytes) || bytes < 0) return "";
        if(bytes < 1024) return bytes + " B";
        if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        if(bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }

    function setStatus(message, type){
        el.pageStatus.textContent = message || "";
        el.pageStatus.className = "status" + (message ? " show " + (type || "info") : "");
    }

    function showToast(message){
        el.toast.textContent = message;
        el.toast.classList.add("show");
        window.clearTimeout(showToast.timeout);
        showToast.timeout = window.setTimeout(() => el.toast.classList.remove("show"), 3500);
    }

    function setBusy(button, busy, busyText){
        if(!button.dataset.originalText) button.dataset.originalText = button.textContent;
        button.disabled = busy;
        button.textContent = busy ? (busyText || "処理中...") : button.dataset.originalText;
    }

    function getErrorMessage(error){
        const message = error?.message || String(error || "不明なエラー");
        if(/row-level security|permission denied|not allowed|42501/i.test(message)){
            return "データベースのアクセス権限で拒否されました。SupabaseのRLSポリシーを確認してください。";
        }
        if(/relation .* does not exist|could not find the table/i.test(message)){
            return "必要なテーブルが見つかりません。テーブル名とSupabaseの構造を確認してください。";
        }
        if(/bucket not found|no such bucket/i.test(message)){
            return "添付ファイル用のStorageバケットがありません。chat-attachmentsを作成してください。";
        }
        if(/JWT|auth session missing|not authenticated/i.test(message)){
            return "ログイン状態を確認できません。再度ログインしてください。";
        }
        return message;
    }

    function requireClient(){
        if(!state.client) throw new Error("Supabaseクライアントが初期化されていません。");
        return state.client;
    }

    async function getProfile(userId){
        const client = requireClient();
        const result = await client.from(TABLES.profiles).select("*").eq("id",userId).maybeSingle();
        if(result.error) throw result.error;
        return result.data;
    }

    function profileDisplayName(profile){
        return profile?.display_name || profile?.displayName || profile?.username || profile?.login_id || "ユーザー";
    }

    function setAvatar(target, profile){
        const name = profileDisplayName(profile);
        const avatarUrl = profile?.avatar_url || profile?.avatarUrl || profile?.photo_url || "";
        if(avatarUrl){
            target.innerHTML = '<img src="' + escapeHtml(safeHttpUrl(avatarUrl)) + '" alt="">';
        }else{
            target.textContent = shortName(name);
        }
    }

    function setChatEnabled(enabled){
        el.messageInput.disabled = !enabled;
        el.sendButton.disabled = !enabled;
        el.refreshMessagesButton.disabled = !enabled;
        if(!enabled) el.messageInput.value = "";
        updateCharCount();
    }

    function updateCharCount(){
        const length = Array.from(el.messageInput.value).length;
        el.charCount.textContent = String(length);
        el.charCount.style.color = length > MAX_TEXT_LENGTH ? "var(--danger)" : "var(--muted)";
        el.sendButton.disabled = !state.currentRoom || state.sending || length > MAX_TEXT_LENGTH;
    }

    async function initialize(){
        cacheElements();

        try{
            if(!window.ARESystem || !window.AREAuth){
                throw new Error("system.jsが読み込まれていません。");
            }

            state.client = window.ARESystem.client;

            const session = await window.AREAuth.getSession();
            if(!session?.user){
                window.location.replace("./index.html");
                return;
            }

            state.user = session.user;
            state.profile = await getProfile(state.user.id).catch(() => null);

            el.myName.textContent = profileDisplayName(state.profile);
            el.myLoginStatus.textContent = "ログイン中";
            setAvatar(el.myAvatar,state.profile);

            bindEvents();
            await Promise.all([loadRecommendations(),loadRooms()]);
            setStatus("チャットの準備ができました。ユーザーを選択してください。","success");

            state.authSubscription = window.AREAuth.onAuthStateChange((event, sessionValue) => {
                if(event === "SIGNED_OUT" || !sessionValue){
                    window.location.replace("./index.html");
                }
            });
        }catch(error){
            console.error("ARE initialization error:",error);
            setStatus(getErrorMessage(error),"error");
            if(/ログイン|session|認証/i.test(error?.message || "")){
                window.setTimeout(() => window.location.replace("./index.html"),1200);
            }
        }
    }

    function bindEvents(){
        el.logoutButton.addEventListener("click",logout);
        el.refreshUsersButton.addEventListener("click",loadRecommendations);
        el.refreshRoomsButton.addEventListener("click",loadRooms);
        el.refreshMessagesButton.addEventListener("click",() => loadMessages(true));
        el.userSearch.addEventListener("input",() => {
            state.searchText = el.userSearch.value.trim().toLocaleLowerCase();
            renderRecommendations();
        });
        el.sendButton.addEventListener("click",sendTextMessage);
        el.messageInput.addEventListener("input",updateCharCount);
        el.messageInput.addEventListener("keydown",(event) => {
            if(event.key === "Enter" && !event.shiftKey && !event.isComposing){
                event.preventDefault();
                sendTextMessage();
            }
        });
        el.imageInput.addEventListener("change",() => handleFiles(el.imageInput.files,"image"));
        el.fileInput.addEventListener("change",() => handleFiles(el.fileInput.files,"file"));
        el.videoInput.addEventListener("change",() => handleFiles(el.videoInput.files,"video"));
        el.backButton.addEventListener("click",() => el.app.classList.remove("chat-open"));
        window.addEventListener("beforeunload",cleanupSubscription);
    }

    async function loadRecommendations(){
        if(state.loadingUsers) return;
        state.loadingUsers = true;
        el.recommendedUsers.innerHTML = '<div class="empty-list">ユーザーを読み込んでいます...</div>';

        try{
            const client = requireClient();
            const result = await client.from(TABLES.profiles).select("*").neq("id",state.user.id).order("display_name",{ascending:true}).limit(100);
            if(result.error) throw result.error;
            state.recommendations = result.data || [];
            renderRecommendations();
        }catch(error){
            console.error("User recommendations error:",error);
            el.recommendedUsers.innerHTML = '<div class="empty-list">ユーザー一覧を取得できませんでした。<br>' + escapeHtml(getErrorMessage(error)) + '</div>';
        }finally{
            state.loadingUsers = false;
        }
    }

    function renderRecommendations(){
        const list = state.recommendations.filter((profile) => {
            const name = profileDisplayName(profile).toLocaleLowerCase();
            return !state.searchText || name.includes(state.searchText);
        });

        if(!list.length){
            el.recommendedUsers.innerHTML = '<div class="empty-list">表示できるユーザーがいません。</div>';
            return;
        }

        el.recommendedUsers.innerHTML = list.map((profile,index) => {
            const name = profileDisplayName(profile);
            const avatar = profile?.avatar_url || profile?.avatarUrl || profile?.photo_url || "";
            const avatarHtml = avatar
                ? '<div class="avatar"><img src="' + escapeHtml(avatar) + '" alt=""></div>'
                : '<div class="avatar">' + escapeHtml(shortName(name)) + '</div>';

            return '<button class="person" type="button" data-user-id="' + escapeHtml(profile.id) + '">' +
                avatarHtml +
                '<span class="person-text"><strong>' + escapeHtml(name) + '</strong><small>ユーザーを追加してチャット</small></span>' +
                '<span class="add" aria-hidden="true">＋</span></button>';
        }).join("");

        el.recommendedUsers.querySelectorAll("[data-user-id]").forEach((button) => {
            button.addEventListener("click",() => openOrCreateDirectChat(button.dataset.userId));
        });
    }

    async function loadRooms(){
        if(state.loadingRooms) return;
        state.loadingRooms = true;
        el.roomList.innerHTML = '<div class="empty-list">チャットを読み込んでいます...</div>';

        try{
            const client = requireClient();
            const membershipResult = await client.from(TABLES.members).select("room_id").eq("user_id",state.user.id);
            if(membershipResult.error) throw membershipResult.error;

            const roomIds = [...new Set((membershipResult.data || []).map((row) => row.room_id).filter(Boolean))];
            if(!roomIds.length){
                state.rooms = [];
                renderRooms();
                return;
            }

            const roomsResult = await client.from(TABLES.rooms).select("*").in("id",roomIds).order("created_at",{ascending:false});
            if(roomsResult.error) throw roomsResult.error;

            const roomRows = roomsResult.data || [];
            const membersResult = await client.from(TABLES.members).select("room_id,user_id").in("room_id",roomIds);
            if(membersResult.error) throw membersResult.error;

            const otherIds = [...new Set((membersResult.data || []).map((row) => row.user_id).filter((id) => id && id !== state.user.id))];
            let profiles = [];

            if(otherIds.length){
                const profilesResult = await client.from(TABLES.profiles).select("*").in("id",otherIds);
                if(profilesResult.error) throw profilesResult.error;
                profiles = profilesResult.data || [];
            }

            state.rooms = roomRows.map((room) => {
                const memberIds = (membersResult.data || []).filter((row) => row.room_id === room.id).map((row) => row.user_id);
                const partnerId = memberIds.find((id) => id !== state.user.id) || null;
                const partner = profiles.find((profile) => profile.id === partnerId) || null;
                return {...room,partner,partnerId};
            });

            renderRooms();
        }catch(error){
            console.error("Room list error:",error);
            el.roomList.innerHTML = '<div class="empty-list">チャット一覧を取得できませんでした。<br>' + escapeHtml(getErrorMessage(error)) + '</div>';
        }finally{
            state.loadingRooms = false;
        }
    }

    function renderRooms(){
        if(!state.rooms.length){
            el.roomList.innerHTML = '<div class="empty-list">まだチャットがありません。<br>おすすめユーザーから相手を選択してください。</div>';
            return;
        }

        el.roomList.innerHTML = state.rooms.map((room) => {
            const name = profileDisplayName(room.partner);
            const avatar = room.partner?.avatar_url || room.partner?.avatarUrl || "";
            const avatarHtml = avatar
                ? '<div class="avatar"><img src="' + escapeHtml(avatar) + '" alt=""></div>'
                : '<div class="avatar">' + escapeHtml(shortName(name)) + '</div>';
            const active = state.currentRoom?.id === room.id ? " active" : "";

            return '<button class="room-item' + active + '" type="button" data-room-id="' + escapeHtml(room.id) + '">' +
                avatarHtml + '<span class="person-text"><strong>' + escapeHtml(name) + '</strong><small>チャットを開く</small></span></button>';
        }).join("");

        el.roomList.querySelectorAll("[data-room-id]").forEach((button) => {
            button.addEventListener("click",() => {
                const room = state.rooms.find((item) => item.id === button.dataset.roomId);
                if(room) selectRoom(room,room.partner);
            });
        });
    }

    async function openOrCreateDirectChat(partnerId){
        if(!partnerId || partnerId === state.user.id) return;

        try{
            setStatus("チャットを開いています...","info");
            const client = requireClient();
            const partner = state.recommendations.find((profile) => profile.id === partnerId) || await getProfile(partnerId);
            if(!partner) throw new Error("相手のプロフィールが見つかりません。");

            const rpcResult = await client.rpc("create_or_get_direct_room",{p_partner_id:partnerId});
            if(rpcResult.error) throw rpcResult.error;

            const roomResult = await client.from(TABLES.rooms).select("*").eq("id",rpcResult.data).maybeSingle();
            if(roomResult.error) throw roomResult.error;
            if(!roomResult.data) throw new Error("ルームを取得できませんでした。");

            await loadRooms();
            const room = state.rooms.find((item) => item.id === roomResult.data.id) || {...roomResult.data,partner,partnerId};
            await selectRoom(room,partner);
        }catch(error){
            console.error("Open direct chat error:",error);
            setStatus(getErrorMessage(error),"error");
        }
    }

    async function selectRoom(room,partner){
        if(!room?.id) return;
        cleanupSubscription();

        state.currentRoom = room;
        state.currentPartner = partner || room.partner || null;
        state.messages = [];

        const name = profileDisplayName(state.currentPartner);
        el.chatTitle.textContent = name;
        el.chatSubtitle.textContent = room.suspended_at ? "このチャットは停止中です" : "1対1チャット";
        setAvatar(el.chatAvatar,state.currentPartner);
        el.app.classList.add("chat-open");

        const suspended = Boolean(room.suspended_at);
        setChatEnabled(!suspended);
        if(suspended){
            setStatus("このチャットルームは停止されているため、送信できません。","error");
        }else{
            setStatus("メッセージを読み込んでいます...","info");
        }

        renderRooms();
        subscribeToMessages();
        await loadMessages(false);
        setStatus(suspended ? "このチャットルームは停止中です。" : "チャットに接続しました。",suspended ? "error" : "success");
        el.messageInput.focus();
    }

    async function loadMessages(showFeedback){
        if(!state.currentRoom || state.loadingMessages) return;
        state.loadingMessages = true;
        const requestedRoomId = state.currentRoom.id;

        try{
            const result = await requireClient()
                .from(TABLES.messages)
                .select("id,room_id,sender_id,content,created_at")
                .eq("room_id",state.currentRoom.id)
                .order("created_at",{ascending:false})
                .limit(500);

            if(result.error) throw result.error;
            if(!state.currentRoom || state.currentRoom.id !== requestedRoomId) return;
            const loaded = (result.data || []).slice().reverse();
            const loadedIds = new Set(loaded.map((m) => m.id));
            const arrived = state.messages.filter((m) => !loadedIds.has(m.id));
            state.messages = loaded.concat(arrived);
            renderMessages(true);
            if(showFeedback) showToast("メッセージを更新しました。");
        }catch(error){
            console.error("Message loading error:",error);
            setStatus(getErrorMessage(error),"error");
        }finally{
            state.loadingMessages = false;
        }
    }

    function subscribeToMessages(){
        if(!state.currentRoom) return;

        const roomId = state.currentRoom.id;
        state.subscription = requireClient()
            .channel("are-messages-" + roomId)
            .on("postgres_changes",{
                event:"INSERT",
                schema:"public",
                table:TABLES.messages,
                filter:"room_id=eq." + roomId
            },(payload) => {
                if(!payload.new) return;
                const exists = state.messages.some((message) => message.id === payload.new.id);
                if(!exists){
                    state.messages.push(payload.new);
                    state.messages.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
                    renderMessages(true);
                }
            })
            .subscribe((status) => {
                if(status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
                    console.warn("Realtime subscription status:",status);
                }
            });
    }

    function cleanupSubscription(){
        if(state.subscription && state.client){
            state.client.removeChannel(state.subscription);
            state.subscription = null;
        }
    }

    function parseMessageContent(content){
        if(typeof content !== "string") return {type:"text",text:String(content ?? "")};
        try{
            const parsed = JSON.parse(content);
            if(parsed && typeof parsed === "object" && ["text","image","file","video"].includes(parsed.type)){
                return parsed;
            }
        }catch(_error){}
        return {type:"text",text:content};
    }

    function renderMessageContent(content){
        const item = parseMessageContent(content);

        if(item.type === "text"){
            return '<div class="bubble">' + escapeHtml(item.text || "") + '</div>';
        }

        const url = item.url || "";
        const name = item.name || "添付ファイル";
        const safeUrl = escapeHtml(safeHttpUrl(url));
        if(!safeUrl){
            return '<div class="bubble">' + escapeHtml(name) + '（添付ファイルのURLが不正なため表示できません）</div>';
        }
        const safeName = escapeHtml(name);
        const size = item.size ? '<div class="file-meta">' + escapeHtml(formatBytes(Number(item.size))) + '</div>' : "";

        if(item.type === "image"){
            return '<div class="bubble"><div class="attachment"><a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer"><img src="' + safeUrl + '" alt="' + safeName + '" loading="lazy"></a><div class="file-meta">' + safeName + '</div></div></div>';
        }

        if(item.type === "video"){
            return '<div class="bubble"><div class="attachment"><video controls preload="metadata" src="' + safeUrl + '"></video><a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">' + safeName + '</a>' + size + '</div></div>';
        }

        return '<div class="bubble"><div class="attachment"><a class="file-card" href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" download="' + safeName + '"><span class="file-icon">📄</span><span><span class="file-name">' + safeName + '</span>' + size + '</span></a></div></div>';
    }

    function renderMessages(scrollToBottom){
        if(!state.messages.length){
            el.messages.innerHTML = '<div class="welcome"><div class="welcome-icon">✉️</div><h2>最初のメッセージを送ろう</h2><div>メッセージやファイルを送信すると、ここに表示されます。</div></div>';
            return;
        }

        el.messages.innerHTML = state.messages.map((message) => {
            const own = message.sender_id === state.user.id;
            const profile = own ? state.profile : state.currentPartner;
            const name = own ? "あなた" : profileDisplayName(profile);
            const avatarUrl = profile?.avatar_url || profile?.avatarUrl || "";
            const avatar = avatarUrl
                ? '<div class="message-avatar"><img src="' + escapeHtml(safeHttpUrl(avatarUrl)) + '" alt=""></div>'
                : '<div class="message-avatar">' + escapeHtml(shortName(name)) + '</div>';

            return '<article class="message-row' + (own ? ' own' : '') + '">' +
                avatar +
                '<div class="message-body"><div class="message-sender">' + escapeHtml(name) + '</div>' +
                renderMessageContent(message.content) +
                '<div class="message-time">' + escapeHtml(formatDate(message.created_at)) + '</div></div></article>';
        }).join("");

        if(scrollToBottom){
            el.messages.scrollTop = el.messages.scrollHeight;
        }
    }

    async function sendTextMessage(){
        if(!state.currentRoom || state.sending) return;

        const text = el.messageInput.value;
        if(!text.trim()){
            showToast("メッセージを入力してください。");
            return;
        }

        if(Array.from(text).length > MAX_TEXT_LENGTH){
            showToast("メッセージは2,000文字以内で入力してください。");
            return;
        }

        await sendMessagePayload({type:"text",text});
    }

    async function sendMessagePayload(payload){
        if(!state.currentRoom || state.sending) return;

        state.sending = true;
        el.sendButton.disabled = true;

        try{
            const client = requireClient();
            const content = JSON.stringify(payload);
            const result = await client.rpc("send_message",{
                p_room_id:state.currentRoom.id,
                p_content:content
            });

            if(result.error) throw result.error;

            if(payload.type === "text"){
                el.messageInput.value = "";
                updateCharCount();
            }

            await loadMessages(false);
        }catch(error){
            console.error("Send message error:",error);
            setStatus(getErrorMessage(error),"error");
        }finally{
            state.sending = false;
            updateCharCount();
        }
    }

    async function handleFiles(fileList,kind){
        const files = Array.from(fileList || []);
        if(!files.length) return;

        if(!state.currentRoom){
            showToast("先にチャット相手を選択してください。");
            clearFileInputs();
            return;
        }

        if(kind === "image" && files.length > MAX_IMAGES){
            showToast("画像は一度に最大10枚まで選択できます。");
            clearFileInputs();
            return;
        }

        if(kind === "video" && files.length > 1){
            showToast("動画は一度に1本ずつ送信してください。");
            clearFileInputs();
            return;
        }

        if(kind === "image" && files.some((file) => !file.type.startsWith("image/"))){
            showToast("画像ファイルを選択してください。");
            clearFileInputs();
            return;
        }

        if(kind === "video" && files.some((file) => !file.type.startsWith("video/"))){
            showToast("動画ファイルを選択してください。");
            clearFileInputs();
            return;
        }

        if(kind === "file"){
            const rejected = files.filter((file) => !FILE_MIME_BY_EXT[fileExt(file)]);
            if(rejected.length){
                showToast("対応形式は PDF・Word(.docx)・Excel(.xlsx)・PowerPoint(.pptx) です：" + rejected.map((f) => f.name).join("、"));
                clearFileInputs();
                return;
            }
        }

        if(kind === "image" && files.some((file) => file.type === "image/svg+xml")){
            showToast("SVG画像は安全上の理由で送信できません。");
            clearFileInputs();
            return;
        }

        for(const file of files){
            if(kind === "video"){
                if(file.size > MAX_VIDEO_BYTES){
                    showToast("動画は1本50MB以下にしてください。");
                    continue;
                }

                try{
                    const duration = await getVideoDuration(file);
                    if(duration > MAX_VIDEO_SECONDS){
                        showToast(file.name + " は5分を超えているため送信できません。");
                        continue;
                    }
                }catch(error){
                    showToast(file.name + " の動画時間を確認できませんでした。");
                    continue;
                }
            }else if(file.size > MAX_FILE_BYTES){
                showToast(file.name + " は50MBを超えているため送信できません。");
                continue;
            }

            await uploadAndSend(file,kind);
        }

        clearFileInputs();
    }

    function clearFileInputs(){
        el.imageInput.value = "";
        el.fileInput.value = "";
        el.videoInput.value = "";
        el.attachmentStatus.textContent = "";
    }

    function getVideoDuration(file){
        return new Promise((resolve,reject) => {
            const video = document.createElement("video");
            const objectUrl = URL.createObjectURL(file);
            video.preload = "metadata";
            video.onloadedmetadata = () => {
                const duration = video.duration;
                URL.revokeObjectURL(objectUrl);
                resolve(duration);
            };
            video.onerror = () => {
                URL.revokeObjectURL(objectUrl);
                reject(new Error("動画メタデータを読み込めません。"));
            };
            video.src = objectUrl;
        });
    }

    async function uploadAndSend(file,kind){
        el.attachmentStatus.textContent = file.name + " をアップロード中...";
        el.app.classList.add("loading");

        try{
            const client = requireClient();
            const safeName = file.name.replace(/[^\w.\-()ぁ-んァ-ヶ一-龠]/g,"_").slice(0,120) || "attachment";
            const objectPath = state.currentRoom.id + "/" + state.user.id + "/" + crypto.randomUUID() + "-" + safeName;

            const uploadResult = await client.storage.from(STORAGE_BUCKET).upload(objectPath,file,{
                cacheControl:"3600",
                contentType:resolveMime(file),
                upsert:false
            });

            if(uploadResult.error) throw uploadResult.error;

            const signedResult = await client.storage.from(STORAGE_BUCKET).createSignedUrl(objectPath,60 * 60 * 24 * 7);
            if(signedResult.error) throw signedResult.error;

            const payload = {
                type:kind,
                name:file.name,
                url:signedResult.data.signedUrl,
                path:objectPath,
                mimeType:resolveMime(file),
                size:file.size
            };

            await sendMessagePayload(payload);
        }catch(error){
            console.error("Attachment upload error:",error);
            setStatus(getErrorMessage(error),"error");
        }finally{
            el.app.classList.remove("loading");
            el.attachmentStatus.textContent = "";
        }
    }

    async function logout(){
        if(!confirm("ログアウトしますか？")) return;

        setBusy(el.logoutButton,true,"ログアウト中...");
        try{
            cleanupSubscription();
            if(state.authSubscription){
                state.authSubscription.unsubscribe();
                state.authSubscription = null;
            }
            await window.AREAuth.logout();
            window.location.replace("./index.html");
        }catch(error){
            console.error("Logout error:",error);
            setStatus(getErrorMessage(error),"error");
            setBusy(el.logoutButton,false);
        }
    }

    initialize();
})();
</script>
