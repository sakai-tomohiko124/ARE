
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>ARE | Realtime Chat</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-glow"></div>

    <main class="app">
        <header class="brand">
            <div class="brand-logo">A</div>
            <div>
                <h1>ARE</h1>
                <p>REALTIME CHAT</p>
            </div>
        </header>

        <section id="loginView" class="panel">
            <h2>おかえりなさい</h2>
            <p class="muted">ログインして会話を始めましょう。</p>

            <form id="loginForm">
                <label for="loginId">ログインID</label>
                <input id="loginId" name="loginId" autocomplete="username" required>

                <label for="loginPassword">パスワード</label>
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>

                <button type="submit" id="loginButton">ログイン</button>
            </form>

            <div class="button-row">
                <button type="button" class="button-secondary" onclick="window.location.href='./register.html'">新規登録</button>
                <button type="button" class="button-secondary" id="showRecovery">アカウント復旧</button>
            </div>
        </section>

        <section id="registerView" class="panel hidden">
            <h2>新規登録</h2>
            <form id="registerForm">
                <label for="displayName">表示名</label>
                <input id="displayName" name="displayName" maxlength="40" required>

                <label for="newLoginId">ログインID</label>
                <input id="newLoginId" name="loginId" maxlength="80" required>

                <label for="newPassword">パスワード</label>
                <input id="newPassword" name="password" type="password" autocomplete="new-password" required>

                <label for="phone">電話番号（任意）</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel">

                <button type="submit" id="registerButton">アカウントを作成</button>
                <button type="button" class="button-secondary" data-view="loginView">戻る</button>
            </form>
        </section>

        <section id="recoveryView" class="panel hidden">
            <h2>アカウント復旧</h2>
            <form id="recoveryForm">
                <label for="recoveryLoginId">ログインID</label>
                <input id="recoveryLoginId" name="loginId" required>

                <label for="recoveryCode">復旧コード</label>
                <input id="recoveryCode" name="recoveryCode" required>

                <label for="recoveryPassword">新しいパスワード</label>
                <input id="recoveryPassword" name="newPassword" type="password" autocomplete="new-password" required>

                <button type="submit" id="recoveryButton">パスワードを再設定</button>
                <button type="button" class="button-secondary" data-view="loginView">戻る</button>
            </form>
        </section>

        <section id="chatView" class="chat-layout hidden">
            <aside class="room-sidebar">
                <div class="sidebar-heading">
                    <h2>ルーム</h2>
                    <button id="createRoomButton" class="icon-button" type="button" aria-label="ルーム作成">＋</button>
                </div>
                <div id="roomList" class="room-list"></div>
                <button id="logoutButton" class="button-secondary" type="button">ログアウト</button>
            </aside>

            <section class="chat-main">
                <header class="chat-header">
                    <div>
                        <h2 id="currentRoomName">ルームを選択</h2>
                        <p id="connectionStatus" class="muted">接続待機中</p>
                    </div>
                </header>

                <div id="messageList" class="message-list" aria-live="polite"></div>

                <form id="messageForm" class="message-form">
                    <input id="messageInput" maxlength="2000" placeholder="メッセージを入力..." autocomplete="off" required>
                    <button id="sendButton" type="submit">送信</button>
                </form>
            </section>
        </section>

        <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
        <footer>ARE · CONNECT WITH EVERYONE</footer>
    </main>

    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="rooms.js"></script>
    <script src="messages.js"></script>
    <script src="realtime.js"></script>
    <script src="app.js"></script>
</body>
</html>
