<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101318"><title>ARE | Chat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>/* AREの基本デザイン */:root{color-scheme:dark;--bg:#101318;--panel:#191e27;--border:#303846;--text:#f4f6fb;--muted:#9ca8bb;--accent:#7c6cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#20233a,#101318 60%);font-family:system-ui,sans-serif;color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(100%,440px);padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 80px #0005}.brand{text-align:center;font-size:32px;font-weight:850;letter-spacing:3px}.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 26px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;margin-bottom:22px;border-radius:12px;background:var(--bg)}.tab{padding:11px;border:0;border-radius:9px;background:transparent;color:var(--muted)}.tab.active{background:#303044;color:white}.screen{display:none}.screen.active{display:block}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:650}.field input{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}.primary,.secondary{width:100%;padding:13px;border-radius:10px;font-weight:700}.primary{border:0;background:var(--accent);color:white}.primary:disabled{opacity:.6}.secondary{margin-top:10px;border:1px solid var(--border);background:transparent;color:var(--muted)}.message{display:none;margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.message.show{display:block}.message.error{background:#48212c;color:#ffc1cb}.messa  for="recoveryCode">復旧コード</label><input id="recoveryCode" name="recoveryCode" required maxlength="128"></div><div class="field"><label for="newPassword">新しいパスワード</label><input id="newPassword" name="newPassword" type="password" minlength="6" maxlength="128" required></div><button class="primary" type="submit">パスワードを再設定</button><button class="secondary" id="backToLogin" type="button">ログインへ戻る</button></form></section><div id="status" class="message" role="status" aria-live="polite"></div><footer class="footer">ARE Chat Application</footer></section></main><script>/* Supabase接続設定。公開用キーのみを設定し、service_roleキーは絶対に記載しない */const SUPABASE_URL="https://xawevnvzkcoijswmujah.supabase.co";const SUPABASE_ANON_KEY="ここにSupabaseの公開用anonキーを設定";const REGISTER_URL=SUPABASE_URL+"/functions/v1/register-user";const LOGIN_URL=SUPABASE_URL+"/functions/v1/login-user";const RECOVERY_URL=SUPABASE_URL+"/functions/v1/recover-account";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const loginTab=document.getElementById("loginTab"),registerTab=document.getElementById("registerTab"),loginScreen=document.getElementById("loginScreen"),registerScreen=document.getElementById("registerScreen"),recoveryScreen=document.getElementById("recoveryScreen"),status=document.getElementById("status");/* 指定された画面を表示する */function showScreen(name){loginScreen.classList.toggle("active",name==="login");registerScreen.classList.toggle("active",name==="register");recoveryScreen.classList.toggle("active",name==="recovery");loginTab.classList.toggle("active",name==="login");registerTab.classList.toggle("active",name==="register");status.className="message";status.textContent=""}/* 処理結果を画面に表示する */function notify(message,type="error"){status.textContent=message;status.className="message show "+type}/* APIレスポンスから安全にメッセージを取り出す */async function requestApi(url,payload){const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.st
