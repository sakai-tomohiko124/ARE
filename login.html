
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>ARE | ログイン</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>
    <div class="background-glow"></div>

    <main class="app">
        <header class="brand">
            <div class="brand-logo">A</div>
            <div>
                <h1>ARE</h1>
                <p>REALTIME CHAT</p>
            </div>
        </header>

        <!-- ログイン画面 -->
        <section id="loginView" class="panel">
            <h2>おかえりなさい</h2>
            <p class="muted">ログインして会話を始めましょう。</p>

            <form id="loginForm">
                <label for="loginId">ログインID</label>
                <input
                    id="loginId"
                    name="loginId"
                    autocomplete="username"
                    maxlength="80"
                    required
                >

                <label for="loginPassword">パスワード</label>
                <input
                    id="loginPassword"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button id="loginButton" class="primary-button" type="submit">
                    ログイン
                </button>
            </form>

            <div class="button-row">
                <button id="showRegister" class="button-secondary" type="button">
                    新規登録
                </button>
                <button id="showRecovery" class="button-secondary" type="button">
                    アカウント復旧
                </button>
            </div>

            <p id="loginStatus" class="status-message" role="status" aria-live="polite"></p>
        </section>

        <!-- ログイン成功後のチャット画面 -->

        <p class="status-message" style="font-size:12px;opacity:.8">ご利用上の注意：運営管理者は、安全管理・不正対策のため会話内容を閲覧できます。個人情報や機密情報は送信しないでください。</p>
        <footer>ARE · CONNECT WITH EVERYONE</footer>
    </main>

<!-- Supabase、接続設定、共通処理、ログイン画面処理の順に読み込みます -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="apikey.js"></script>
    <script src="system.js"></script>
    <script src="login.js"></script>
</body>
</html>
