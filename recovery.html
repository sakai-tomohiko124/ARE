
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>ARE | アカウント復旧</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #0b1020;
            --panel: #151c2e;
            --border: #2a344b;
            --text: #f4f6ff;
            --muted: #9ba7c0;
            --accent: #818cf8;
            --accent-hover: #6366f1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background);
            color: var(--text);
            font-family: system-ui, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 15% 15%, #4338ca33, transparent 35%),
                radial-gradient(circle at 85% 85%, #7c3aed22, transparent 35%);
        }

        .app {
            width: min(100%, 460px);
            margin: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .brand-logo {
            display: grid;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #818cf8, #7c3aed);
            font-size: 25px;
            font-weight: 800;
        }

        .brand h1 {
            margin: 0 0 3px;
            letter-spacing: 4px;
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .panel {
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #151c2eee;
            box-shadow: 0 20px 70px #0003;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .description {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            color: #cbd5e1;
            font-size: 13px;
        }

        input {
            width: 100%;
            min-width: 0;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: #0c1220;
            color: var(--text);
            font: inherit;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            min-height: 43px;
            padding: 10px 14px;
            border: 0;
            border-radius: 9px;
            background: var(--accent);
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        .primary-button {
            width: 100%;
            margin-top: 22px;
        }

        .secondary-button {
            width: 100%;
            margin-top: 10px;
            border: 1px solid var(--border);
            background: #222b40;
        }

        .secondary-button:hover {
            background: #303b55;
        }

        .status-message {
            min-height: 24px;
            margin-top: 14px;
            overflow-wrap: anywhere;
            font-size: 13px;
            line-height: 1.7;
        }

        .status-message[data-state="error"] {
            color: #fca5a5;
        }

        .status-message[data-state="success"] {
            color: #a7f3d0;
        }

        footer {
            margin-top: 18px;
            color: #68748d;
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .panel {
                padding: 20px 16px;
            }

            h2 {
                font-size: 21px;
            }
        }

        @media (max-height: 650px) {
            body {
                align-items: flex-start;
            }

            .app {
                margin: 8px auto;
            }

            .brand {
                margin-bottom: 12px;
            }

            .panel {
                padding: 16px;
            }

            .description {
                margin-bottom: 12px;
            }

            label {
                margin-top: 10px;
            }

            .primary-button {
                margin-top: 14px;
            }

            footer {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="brand">
            <div class="brand-logo">A</div>
            <div>
                <h1>ARE</h1>
                <p>REALTIME CHAT</p>
            </div>
        </header>

        <section class="panel">
            <h2>アカウント復旧</h2>
            <p class="description">
                ログインIDと復旧コードを入力し、新しいパスワードを設定してください。
            </p>

            <form id="recoveryForm">
                <label for="loginId">ログインID</label>
                <input
                    id="loginId"
                    name="loginId"
                    type="text"
                    autocomplete="username"
                    maxlength="80"
                    required
                >

                <label for="recoveryCode">復旧コード</label>
                <input
                    id="recoveryCode"
                    name="recoveryCode"
                    type="text"
                    autocomplete="off"
                    required
                >

                <label for="newPassword">新しいパスワード</label>
                <input
                    id="newPassword"
                    name="newPassword"
                    type="password"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmPassword">新しいパスワード（確認）</label>
                <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    required
                >

                <button id="recoveryButton" class="primary-button" type="submit">
                    パスワードを再設定
                </button>

                <button id="backToLogin" class="secondary-button" type="button">
                    ログイン画面へ戻る
                </button>
            </form>

            <div
                id="statusMessage"
                class="status-message"
                role="status"
                aria-live="polite"
            ></div>
        </section>

        <footer>ARE · CONNECT WITH EVERYONE</footer>
    </main>

    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="system.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("recoveryForm");
            const button = document.getElementById("recoveryButton");
            const status = document.getElementById("statusMessage");
            const passwordInput = document.getElementById("newPassword");
            const confirmInput = document.getElementById("confirmPassword");

            function showStatus(message, isError = false) {
                status.textContent = message;
                status.dataset.state = isError ? "error" : "success";
            }

            document.getElementById("backToLogin").addEventListener("click", () => {
                window.location.href = "./index.html";
            });

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const formData = new FormData(form);
                const loginId = String(formData.get("loginId") || "").trim();
                const recoveryCode = String(formData.get("recoveryCode") || "").trim();
                const newPassword = String(formData.get("newPassword") || "");
                const confirmPassword = String(formData.get("confirmPassword") || "");

                if (!loginId || !recoveryCode || !newPassword || !confirmPassword) {
                    showStatus("すべての必須項目を入力してください。", true);
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showStatus("新しいパスワードが一致しません。", true);
                    confirmInput.focus();
                    return;
                }

                if (newPassword.length < 8) {
                    showStatus("パスワードは8文字以上にしてください。", true);
                    passwordInput.focus();
                    return;
                }

                if (!window.AREAuth || typeof window.AREAuth.recover !== "function") {
                    showStatus("復旧機能を読み込めません。system.jsを確認してください。", true);
                    return;
                }

                button.disabled = true;
                button.textContent = "再設定しています...";

                try {
                    showStatus("アカウントを復旧しています...");

                    const result = await window.AREAuth.recover(
                        loginId,
                        recoveryCode,
                        newPassword
                    );

                    form.reset();
                    showStatus(
                        result.message || "パスワードを再設定しました。ログイン画面からログインしてください。"
                    );
                } catch (error) {
                    showStatus(
                        error.message || "パスワードの再設定に失敗しました。",
                        true
                    );
                } finally {
                    button.disabled = false;
                    button.textContent = "パスワードを再設定";
                }
            });
        });
    </script>
</body>
</html>
