
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>ARE | 新規登録</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-glow"></div>

    <main class="app">
        <header class="brand">
            <div class="brand-logo">A</div>
            <div>
                <h1>ARE</h1>
                <p>REALTIME CHAT</p>
            </div>
        </header>

        <section class="panel">
            <h2>新規登録</h2>
            <p class="muted">AREのアカウントを作成しましょう。</p>

            <form id="registerForm">
                <label for="displayName">表示名</label>
                <input id="displayName" name="displayName" maxlength="40" autocomplete="nickname" required>

                <label for="newLoginId">ログインID</label>
                <input id="newLoginId" name="loginId" maxlength="80" autocomplete="username" required>

                <label for="newPassword">パスワード</label>
                <input id="newPassword" name="password" type="password" autocomplete="new-password" required>

                <label for="confirmPassword">パスワード（確認）</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>

                <label for="phoneNumber">電話番号（任意）</label>
                <input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel">

                <button type="submit" id="registerButton">アカウントを作成</button>
            </form>

            <div class="button-row">
                <button type="button" class="button-secondary" id="backToLogin">ログイン画面へ戻る</button>
            </div>

            <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
        </section>

        <footer>ARE · CONNECT WITH EVERYONE</footer>
    </main>

    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("registerForm");
            const button = document.getElementById("registerButton");
            const status = document.getElementById("statusMessage");

            function showStatus(message, isError = false) {
                status.textContent = message;
                status.dataset.state = isError ? "error" : "success";
            }

            document.getElementById("backToLogin").addEventListener("click", () => {
                window.location.href = "./index.html";
            });

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const formData = new FormData(form);
                const displayName = String(formData.get("displayName") || "").trim();
                const loginId = String(formData.get("loginId") || "").trim();
                const password = String(formData.get("password") || "");
                const confirmPassword = String(formData.get("confirmPassword") || "");
                const phoneNumber = String(formData.get("phoneNumber") || "").trim();

                if (password !== confirmPassword) {
                    showStatus("パスワードが一致しません。", true);
                    return;
                }

                button.disabled = true;

                try {
                    showStatus("アカウントを作成しています...");

                    const result = await AREAuth.register(displayName, loginId, password, phoneNumber);

                    form.reset();

                    if (result.recoveryCode) {
                        showStatus("登録が完了しました。復旧コードを安全な場所に保存してください: " + result.recoveryCode);
                    } else {
                        showStatus(result.message || "登録が完了しました。ログイン画面へ戻ってください。");
                    }
                } catch (error) {
                    showStatus(error.message || "登録に失敗しました。", true);
                } finally {
                    button.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
